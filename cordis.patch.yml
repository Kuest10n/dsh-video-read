# Host-level bundle: registers the video-reading tools for every agent in this profile.
#
# Install from this repository:
#   plugin_manager(action="install_bundle", target="https://github.com/Kuest10n/dsh-video-read")
# or from a local checkout:
#   plugin_manager(action="install_bundle", target="E:\\path\\to\\dsh-video-read")
#
# The Web settings panel exposes caption model selection (enumerated from the
# local DSH LLM registry). Machine-specific cookie / ffmpeg / yt-dlp paths stay
# out of the web form for safety: set them in cordis.patch.yml, environment
# variables, or ~/.dsh/cache/dsh-video-read/settings.json.
- insert:
    - id: dsh-video-read
      name: 'dsh-video-read'
      config:
        autoDownloadFfmpeg: true
        autoDownloadYtdlp: true
        cookieFile: ''
        maxFrames: 16
        keepSource: true
